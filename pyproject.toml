[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastbench-event-type-correlation"
version = "0.1.0"
description = "Auditable event-type analysis of pairwise ForecastBench model dependence."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
